name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          shellcheck sh/*.sh
          for script in sh/*.sh; do
            bash -n "$script"
          done

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PowerShell scripts
        timeout-minutes: 5
        shell: powershell
        run: |
          # Windows PowerShell 5.1 on purpose: that is what a fresh install has.
          $failed = $false
          foreach ($script in Get-ChildItem windows -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | Out-Host; $failed = $true }
          }
          $findings = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error, Warning
          if ($findings) { $findings | Format-Table -AutoSize | Out-Host; $failed = $true }
          if ($failed) { exit 1 }

  autohotkey:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify AutoHotkey v2
        timeout-minutes: 5
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'AutoHotkey_2.0.32.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'AutoHotkey-v2'
          # autohotkey.com serves a Cloudflare challenge to CI; GitHub hosts the same release asset.
          Invoke-WebRequest -Uri 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.32/AutoHotkey_2.0.32.zip' -OutFile $archive
          # Published in the upstream v2.0.32 GitHub release notes; matches the release asset digest.
          $expected = '384A4C125E8D7B5B77DDBD5A593EC761D3E9E96E97A95931CF56E9A077FDA114'
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "AutoHotkey ZIP SHA256 mismatch ($actual)"
          }
          Expand-Archive -Path $archive -DestinationPath $destination
      - name: Check AutoHotkey syntax
        timeout-minutes: 2
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'AutoHotkey-v2/AutoHotkey64.exe'
          # /validate loads the script, reports errors/warnings, and exits without running it.
          & $exe /ErrorStdOut /validate 'autohotkey\capslock_remap_vim.ahk' 2>&1 | Out-Host; exit $LASTEXITCODE
