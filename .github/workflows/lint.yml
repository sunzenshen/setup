name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          shellcheck sh/*.sh
          for script in sh/*.sh; do
            bash -n "$script"
          done

  autohotkey:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify AutoHotkey v1
        timeout-minutes: 5
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'AutoHotkey_1.1.37.02.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'AutoHotkey-v1'
          Invoke-WebRequest -Uri 'https://www.autohotkey.com/download/1.1/AutoHotkey_1.1.37.02.zip' -OutFile $archive
          # Published in the upstream v1.1.37.02 GitHub release notes.
          $expected = '6F3663F7CDD25063C8C8728F5D9B07813CED8780522FD1F124BA539E2854215F'
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "AutoHotkey ZIP SHA256 mismatch ($actual)"
          }
          Expand-Archive -Path $archive -DestinationPath $destination
      - name: Check AutoHotkey syntax
        timeout-minutes: 2
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'AutoHotkey-v1/AutoHotkeyU64.exe'
          # /iLib parses the script and exits before executing its hotkeys.
          & $exe /ErrorStdOut /iLib NUL 'autohotkey\capslock_remap_vim.ahk' | Out-Host
          exit $LASTEXITCODE
