# MarbleScroll-style scrolling: hold the middle button and move the mouse/trackball to scroll.
# A middle click without movement is still delivered as a normal middle click.
# Install to /etc/X11/xorg.conf.d/ (X11 sessions only; takes effect on next login).
# Try values live first with: xinput set-prop <id> "libinput <property>" <value>

Section "InputClass"
    Identifier "button scrolling"
    MatchIsPointer "on"
    MatchDriver "libinput"
    Option "ScrollMethod" "button"
    # 2 = middle, 8 = back, 9 = forward
    Option "ScrollButton" "2"
    # Click once to toggle scroll mode instead of holding
    # Option "ScrollButtonLock" "on"
    # Pixels of movement per scroll step; bigger = slower (default 15)
    # Option "ScrollPixelDistance" "30"
EndSection
