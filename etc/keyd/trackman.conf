# Logitech Trackman Marble. To opt in another mouse, find its ID with
# keyd monitor and add an m:vendor:product entry below.
[ids]
m:046d:c408

[main]
# Tap either small side button for middle click. Hold it while moving to scroll.
# The MatchIsPointer InputClass in 40-button-scroll.conf enables libinput
# button-2 scrolling on the keyd virtual pointer that emits these events on X11.
mouseback = middlemouse
mouseforward = middlemouse
