# NOTE: to use this, rename this file to default.conf and put in /etc/keyd/

[ids]
*

[main]
capslock = overload(ctrl_vim, esc)

# ctrl_vim modifier layer; inherits from 'Ctrl' modifier layer
[ctrl_vim:C]

h = left
j = down
k = up
l = right
up = volumeup
down = volumedown
left = previoussong
right = nextsong
d = pagedown
u = pageup
; = enter
n = backspace
m = delete
# move word
, = C-left
. = C-right
# desktop (Ctrl+Alt+Arrows typically for desktop navigation on Linux)
[ = C-A-left
] = C-A-right
\ = C-A-up
' = C-A-down
# alacritty terminal mode
/ = C-S-space
# close window (Alt+F4 is common on both Windows and Linux)
e = A-f4

#tabs
tab = C-pageup
q = C-pagedown

1 = M-1
2 = M-2
3 = M-3
4 = M-4
5 = M-5
6 = M-6
7 = M-7
8 = M-8
9 = M-9
0 = M-0


space = swap(space_mode)

[ctrl_vim+alt]
h = M-left
j = M-down
k = M-up
l = M-right
f = f11

# keyd otherwise keeps explicit ctrl_vim bindings for these keys.
up = C-A-up
down = C-A-down
left = C-A-left
right = C-A-right
d = C-A-d
u = C-A-u
semicolon = C-A-semicolon
n = C-A-n
m = C-A-m
comma = C-A-comma
dot = C-A-dot
leftbrace = C-A-leftbrace
rightbrace = C-A-rightbrace
backslash = C-A-backslash
apostrophe = C-A-apostrophe
slash = C-A-slash
e = C-A-e
tab = C-A-tab
q = C-A-q
1 = C-A-1
2 = C-A-2
3 = C-A-3
4 = C-A-4
5 = C-A-5
6 = C-A-6
7 = C-A-7
8 = C-A-8
9 = C-A-9
0 = C-A-0
space = C-A-space

# space_mode modifier layer; also inherits from 'Ctrl' modifier layer
[space_mode:C]

# terminal
t = C-A-t
# select word
n = C-S-left
m = C-S-right
, = home
. = end
# tab navigation
h = C-pageup
l = C-pagedown
j = pagedown
k = pageup
# alacritty terminal mode
/ = C-S-space
# enter
; = enter

